<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- App Title -->
    <title>EcoTrack – Carbon Footprint Platform</title>

    <!-- App Description -->
    <meta
      name="description"
      content="EcoTrack is a smart carbon footprint tracking platform that helps users monitor, analyze, and reduce their environmental impact through AI-driven insights."
    />
    <meta name="author" content="EcoTrack Team" />

    <!-- Open Graph (for social sharing) -->
    <meta property="og:title" content="EcoTrack – Carbon Footprint Platform" />
    <meta
      property="og:description"
      content="Track your carbon footprint, get personalized eco-friendly recommendations, and contribute to a sustainable future with EcoTrack."
    />
    <meta property="og:type" content="website" />
    <meta
      property="og:image"
      content="https://yourdomain.com/opengraph-image.png"
    />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@EcoTrack" />
    <meta
      name="twitter:image"
      content="https://yourdomain.com/opengraph-image.png"
    />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
